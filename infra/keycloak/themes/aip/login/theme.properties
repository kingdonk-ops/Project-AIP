# AIP login theme (IDENTITY-01, ADR 0005). Extends Keycloak's PatternFly 5 login theme and adds
# AIP colours and type. Labels come from config/terms/en-AU/auth.json through
# tools/keycloak_messages.py (messages/messages_en.properties is generated: do not edit it).
# Colours and type follow the @aip/ui tokens (DESIGN-07; tools/tests/test_login_theme.py checks drift).
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/aip.css

# DESIGN-18: the app has no dark mode, so the sign-in pages stay on the light DESIGN-09 surfaces
# (keycloak.v2 would otherwise switch PatternFly to dark under prefers-color-scheme: dark and mix
# dark fields into the white card). High contrast follows prefers-contrast: more in aip.css.
darkMode=false

locales=en
