# Web server for the Coolify demo (OPS-11): apps/web/nginx.conf plus Keycloak under /auth.
# Coolify's proxy (Traefik) terminates TLS in front of this; HSTS is sent here (SECURITY-11).
#
# Security headers (DESIGN-02, OPS-11) mirror apps/web/security-headers.json. nginx drops inherited
# add_header lines in any block that sets its own, so every location repeats the full set
# (tools/tests/test_coolify.py checks both nginx configs against the JSON). HSTS (SECURITY-11)
# is nginx-only, not in the JSON: TLS always ends in front of this server, never at vite.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Docker's embedded DNS, for the per-request Keycloak lookup below.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # The client address: Coolify's proxy (Traefik) reaches this container from a private Docker
    # network and appends the real peer to X-Forwarded-For. Trusting only private hops and taking
    # the rightmost untrusted address means a client-supplied X-Forwarded-For cannot pick its own IP
    # (the API's login rate limit and Keycloak's brute-force detection key on it). Upstreams get
    # this one address, never the client's list.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # OPS-11: Keycloak behind the same origin under /auth (KC_HTTP_RELATIVE_PATH=/auth), so sign-in
    # needs no second domain. Only the two demo realms and Keycloak's static resources are public
    # (an allowlist): the admin console, the admin REST API and the master realm are not; the API
    # reaches the admin API inside the network (keycloak:8080/auth/admin). Variables in proxy_pass
    # make nginx resolve the name per request, so the web container starts even while Keycloak is
    # restarting.
    location = /auth/admin {
        return 404;
    }
    location /auth/admin/ {
        return 404;
    }
    location /auth/ {
        return 404;
    }
    # The mock IdP's account console and account REST API are not public (review 11, H1): its
    # demo users are in the public repo, and both brokers trust its emails (trustEmail), so a
    # signed-in user could change an email there and sign in to the app as someone else. No other
    # realm path starts with "account", so the prefix also catches "account;..." variants. Regex
    # locations match in config order, so this stays above the allowlist. The realm itself also
    # refuses profile and email changes (realm-mock-idp.json).
    location ~ ^/auth/realms/mock-idp/account {
        return 404;
    }
    location ~ ^/auth/(realms/(aip|mock-idp)|resources)/ {
        set $keycloak http://keycloak:8080;
        proxy_pass $keycloak;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        # Keycloak sends its own CSP (with frame-ancestors) for its login pages; ours would be a
        # second, stricter policy on top, so this location sets every header except the CSP.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    # The API, same origin (as `vite preview` does in the e2e run).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # SSE (OPS/notifications) must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Hashed build files (vite build.assetsDir). Not /assets/: that is the asset register route.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files $uri =404;
    }

    # Client-side routes fall back to the SPA shell.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }
}
