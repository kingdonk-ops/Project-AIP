name: tracking

on:
  pull_request:
  push:
    branches: [main]

jobs:
  board:
    name: Validate task board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Board integrity (ids, deps, task files, modules)
        run: python3 tools/next_task.py --check
