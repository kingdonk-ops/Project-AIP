name: tracking

on:
  pull_request:
  # Merge queue: CI runs on the PR merged onto the latest main before it lands.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  board:
    name: Validate task board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Board integrity (ids, deps, task files, modules)
        run: python3 tools/next_task.py --check
      - name: Task specs follow the ADRs (PLAN-R1 linter)
        run: python3 tools/lint_tasks.py --quiet
