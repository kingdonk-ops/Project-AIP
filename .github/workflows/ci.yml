name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} (ruff, pyright, pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    # Real Postgres for the DB tests (DATABASE-08): a service container, reached through
    # AIP_TEST_DATABASE_URL. Locally the fixture falls back to Testcontainers when Docker runs.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aip_test
          POSTGRES_PASSWORD: aip_test
          POSTGRES_DB: aip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aip_test -d aip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      UV_PYTHON: ${{ matrix.python }}
      AIP_TEST_DATABASE_URL: postgresql://aip_test:aip_test@localhost:5432/aip_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-packages --frozen
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format
        run: uv run ruff format --check
      - name: Pyright
        run: uv run pyright
      - name: Pytest
        run: uv run pytest -q

  db:
    name: Database (bootstrap, migrate, snapshot, check-schema, lint, migrator image)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Throwaway CI-only credentials for the service container; not secrets.
      SUPERUSER_URL: postgresql://postgres:postgres@localhost:5432/aip
      DATABASE_MIGRATOR_URL: postgresql://aip_owner:aip_owner_ci@localhost:5432/aip
      # psql and pg_dump come from the server's own image, so the client always matches it.
      PG_DUMP: docker run --rm --network host -e PGPASSWORD pgvector/pgvector:pg16 pg_dump
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # aip-db lint diffs migrations/versions against origin/main
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-packages --frozen
      - name: Bootstrap the cluster as superuser (db/bootstrap/00_cluster.sql)
        run: >-
          docker run --rm -i --network host
          -e PGOPTIONS="-c aip.owner_password=aip_owner_ci"
          pgvector/pgvector:pg16
          psql "$SUPERUSER_URL" -v ON_ERROR_STOP=1 -f - < db/bootstrap/00_cluster.sql
      - name: aip-db migrate
        run: uv run aip-db migrate
      - name: aip-db migrate again applies nothing
        run: |
          uv run aip-db migrate 2> second.log
          cat second.log
          if grep -q "Running upgrade" second.log; then echo "second migrate applied revisions"; exit 1; fi
      - name: Schema snapshot is up to date
        run: |
          uv run aip-db snapshot
          git diff --exit-code db/schema.snapshot.sql
      - name: Migrated schema matches the declared tables
        run: uv run aip-db check-schema
      - name: Migration lint
        run: uv run aip-db lint --base origin/main
      - name: Build the migrator image
        run: docker build -f infra/docker/migrator.Dockerfile -t aip-migrator:ci .
      - name: Migrator image runs as non-root and migrates
        run: |
          uid=$(docker run --rm --entrypoint id aip-migrator:ci -u)
          echo "uid=$uid"
          test "$uid" != "0"
          docker run --rm --network host -e DATABASE_MIGRATOR_URL aip-migrator:ci

  typescript:
    name: TypeScript (lint, typecheck, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm -r lint
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Build
        run: pnpm -r build
      - name: Test
        run: pnpm -r test
      - name: Web build output exists
        run: test -f apps/web/dist/index.html

  # ARCH-03: a required status check in branch protection. Module boundaries and repo layout.
  boundaries:
    name: boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: |
          uv sync --all-packages --frozen
          pnpm install --frozen-lockfile
      - name: Python import contracts (no-deep-module-import, platform-never-imports-modules)
        run: uv run lint-imports --no-cache
      - name: Module manifests declare the permissions, events and term keys their code uses
        run: python3 tools/ci/check_manifests.py
      - name: Repository layout (ADR 0004)
        run: python3 tools/ci/check_layout.py
      - name: ESLint boundaries (apps never import other apps)
        run: pnpm -r lint

  layout:
    name: Repository layout (ADR 0004)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Alembic is the only migration path (DATABASE-08)
        run: |
          set -e
          if [ -e db/migrations ]; then echo "forbidden path: db/migrations/"; exit 1; fi
          if git ls-files | grep -E '(^|/)migrations/.*\.(ts|mts|cts|js|mjs|cjs)$'; then
            echo "TypeScript/JavaScript migration files"; exit 1
          fi
          if git ls-files -- '*package.json' | xargs grep -lE '"(node-pg-migrate|kysely)"'; then
            echo "node-pg-migrate or Kysely dependency"; exit 1
          fi

  docs:
    name: ADR record, version pins and security docs (STACK-01, SECURITY-01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Check ADRs, errata marker and versions table
        run: python3 tools/ci/check_adrs.py
      - name: Unit and integration tests for the checker
        run: python3 -m unittest tools/ci/test_check_adrs.py
      - name: Check threat model and provenance log (SECURITY-01)
        run: python3 tools/ci/check_security_docs.py
      - name: Unit and integration tests for the security docs checker
        run: python3 -m unittest tools/ci/test_check_security_docs.py
