# Dependabot version updates (SECURITY-08). Without this, base images and third-party actions are
# never bumped automatically, so a CVE fix only lands when someone edits the file by hand. Weekly
# updates per ecosystem, with minor/patch bumps grouped into one PR each to cut review noise; major
# bumps still come as their own PRs. See also config/vuln-exceptions.txt and tools/ci/scan_images.sh.
#
# Runtime pins: the python base image takes patch bumps only (Dependabot counts 3.12 -> 3.15 as
# "minor") and node stays on its major line (22.x; its security fixes ship as minors). A runtime
# upgrade needs the API, CI matrix and every Dockerfile moved together, so it is done by hand, not
# by a bot PR (#170, #172-#174 all broke CI).
#
# Security updates (Dependabot alerts) ignore the schedule and arrive as soon as an advisory lands;
# the `security` groups put all of one ecosystem's fixes in a single PR.
#
# Known gap: none for Docker. apps/api/Dockerfile names its base image directly (not via an ARG), so
# Dependabot can bump it; the other Dockerfiles already use plain `FROM` lines. Custom filenames
# (migrator.Dockerfile, postgres.Dockerfile, keycloak.Dockerfile) are picked up — Dependabot's
# docker updater matches any filename containing "dockerfile".
version: 2
updates:
  # --- Container base images -------------------------------------------------------------------
  - package-ecosystem: docker
    directory: /apps/api # Dockerfile (aip-api / aip-migrator share this Python base)
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /apps/web # Dockerfile (node build stage, nginx-unprivileged runtime)
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /infra/docker # migrator.Dockerfile
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /infra/coolify/images # postgres.Dockerfile, keycloak.Dockerfile
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # --- Workflow actions ------------------------------------------------------------------------
  # Every bump, majors included, in one PR: CI on that PR exercises the new actions directly.
  - package-ecosystem: github-actions
    directory: / # .github/workflows/*
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # --- Python (uv workspace) and the pnpm/npm workspace ----------------------------------------
  - package-ecosystem: uv
    directory: / # pyproject.toml + uv.lock (the uv workspace root)
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: / # package.json + pnpm-lock.yaml (the pnpm workspace; npm ecosystem covers pnpm)
    schedule:
      interval: weekly
    # TypeScript 7 (the native compiler) waits until typescript-eslint supports it and
    # openapi-typescript no longer needs the TS 6 compiler API (#188). Lift this then.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
