# Root uv workspace (ADR 0004). Members are Python packages under apps/.
[tool.uv.workspace]
members = ["apps/api"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "import-linter>=2.15",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# tools/next_task.py and tools/split_blueprint.py predate the lint config.
extend-exclude = [".venv", "node_modules", "docs", "tools/next_task.py", "tools/split_blueprint.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["aip"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["apps/api/aip", "apps/api/tests", "tools/new_module.py", "tools/gen_module_map.py", "tools/tests", "tools/ci"]
exclude = ["**/__pycache__", "**/node_modules", "apps/api/aip/modules/_template", "apps/api/tests/arch/fixtures"]
typeCheckingMode = "standard"
strict = ["apps/api/aip/platform"]
extraPaths = ["apps/api"]

[tool.pytest.ini_options]
testpaths = ["apps/api", "tools/tests"]
addopts = ["--import-mode=importlib"]
# Makes `tests.*` (fixture module packages, ARCH-02) importable alongside `aip`.
pythonpath = ["apps/api"]
norecursedirs = [".venv", "node_modules", "_template", ".*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Import boundaries (ARCH-03, ADR 0004). Run from the repo root: `uv run lint-imports`
# (the custom contract type is loaded from tools/ci via the cwd on sys.path).
[tool.importlinter]
root_packages = ["aip"]
contract_types = ["module_public_api: tools.ci.importlinter_contracts.ModulePublicApiContract"]

[[tool.importlinter.contracts]]
id = "no-deep-module-import"
name = "no-deep-module-import"
type = "module_public_api"
modules = "aip.modules"

[[tool.importlinter.contracts]]
id = "platform-never-imports-modules"
name = "platform-never-imports-modules"
type = "forbidden"
source_modules = ["aip.platform"]
forbidden_modules = ["aip.modules"]
