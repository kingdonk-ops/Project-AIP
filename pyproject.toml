# Root uv workspace (ADR 0004). Members are Python packages under apps/.
[tool.uv.workspace]
members = ["apps/api"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# tools/next_task.py and tools/split_blueprint.py predate the lint config.
extend-exclude = [".venv", "node_modules", "docs", "tools/next_task.py", "tools/split_blueprint.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["aip"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["apps/api/aip", "apps/api/tests", "tools/new_module.py", "tools/tests"]
exclude = ["**/__pycache__", "**/node_modules", "apps/api/aip/modules/_template"]
typeCheckingMode = "standard"
strict = ["apps/api/aip/platform"]
extraPaths = ["apps/api"]

[tool.pytest.ini_options]
testpaths = ["apps/api", "tools/tests"]
addopts = ["--import-mode=importlib"]
norecursedirs = [".venv", "node_modules", "_template", ".*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
