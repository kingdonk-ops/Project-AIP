# DATABASE-07: per-table seed values and exceptions for the generated isolation tests
# (tests/isolation/test_rls_generated.py). Owned via .github/CODEOWNERS like the schema guard
# allowlist: every entry needs a non-empty `reason`.
#
#   [tables.<name>]
#   reason = "why the generic seed is not enough"
#   values = { column = "SQL literal" }   # for both rows; {tag} becomes a or b
#   skip = true                           # only with a reason; reported as "exempt"
#   no_app_select = true                  # aip_app may not read it (and so may not write it)
#   move_refused = "error text"          # a trigger that refuses every move to another tenant
#   update_set = "col = col + 1"         # extra SET a trigger needs on every UPDATE probe
#
# Columns are otherwise filled from their type, or from a single-column CHECK IN-list.

[tables.assets]
reason = "ck_assets_path_leaf needs the ltree path's leaf label to be the row id's 32 hex digits, and ck_assets_root needs a one-label path for a parentless row; the generic seed (a random id and a fixed 'iso' path) cannot satisfy either. Seed a root row whose single-label path is its own id."
values = { id = "'0192f3c4-0000-7000-8000-00000000000{tag}'::uuid", path = "'0192f3c400007000800000000000000{tag}'::ltree" }

[tables.access_reviews]
reason = "quarter must look like 2026-Q4 (ck_access_reviews_quarter)."
values = { quarter = "'2026-Q4'" }

[tables.app_user]
reason = "email must look like an address (ck_app_user_email); unique per row."
values = { email = "'iso-{tag}@kaefer.test'" }

[tables.audit_chain_checkpoints]
reason = "segment is a YYYY-MM month (ck_audit_chain_checkpoints_segment)."
values = { segment = "'2026-10'" }

[tables.auth_event]
reason = "event_type is a dotted lowercase name (ck_auth_event_event_type)."
values = { event_type = "'iso.event'" }

[tables.tenant_entitlement_override]
reason = "key is feature.* or limit.* (ck_tenant_entitlement_override_key)."
values = { key = "'feature.iso'" }

[tables.tenant_subscription]
reason = "an annual term needs a contract_ref (ck_tenant_subscription_contract_ref); a sandbox term needs none."
values = { term = "'sandbox'" }

[tables.tenant_usage]
reason = "period is the first day of a month (ck_tenant_usage_period)."
values = { period = "date_trunc('month', current_date)::date" }

[tables.term_key]
reason = "key is a dotted term key (ck_term_key_key)."
values = { key = "'iso.key_{tag}'" }

[tables.term_override]
reason = "a tenant-level override has no client org or project (ck_term_override_level)."
values = { level = "'tenant'" }

[tables.term_pack_version]
reason = "contents_sha256 is 64 lowercase hex digits (ck_term_pack_version_sha256)."
values = { contents_sha256 = "repeat('a', 64)" }

[tables.tenants]
reason = "slug is lowercase letters, digits and hyphens (ck_tenants_slug); unique per row."
values = { slug = "'iso-{tag}'" }

[tables.term_pack]
reason = "code is lowercase words joined by hyphens (ck_term_pack_code)."
values = { code = "'iso-pack'" }

[tables.workflow_definitions]
reason = "states and transitions are JSON arrays (ck_workflow_definitions_states, ck_workflow_definitions_transitions)."
values = { states = "'[]'::jsonb", transitions = "'[]'::jsonb" }

[tables.workflow_decision_history]
reason = "seq is positive, the hashes are 64 hex characters and status is applied or pending_countersign (APPROVALS-02 check constraints)."
values = { seq = "1", prev_hash = "repeat('a', 64)", entry_hash = "repeat('b', 64)", status = "'applied'" }

[tables.access_settings]
reason = "a trigger refuses to move or delete any row (one per tenant, ACCESS-01), which is stricter than the RLS WITH CHECK the move probe looks for."
move_refused = "access_settings rows are never deleted or moved"
update_set = "access_version = access_version + 1"  # its other trigger: the version must rise

[tables.audit_chain_heads]
reason = "writer bookkeeping (AUDIT-01): only aip_audit_writer reads and writes it; aip_app holds no privilege."
no_app_select = true

[tables.login_directory]
reason = "pre-login tenant resolution (ADR 0005): no runtime role holds any privilege; read only through the SECURITY DEFINER function identity_resolve_login."
no_app_select = true

[tables.signoff_policy]
reason = "action_code is a dotted lowercase code (ck_signoff_policy_action_code)."
values = { action_code = "'iso.action_{tag}'" }

[tables.projects]
reason = "ACCESS-03 adds a restrictive project-scope policy, so a principal is needed to see any project. A system principal is tenant-wide, so the own-row probe sees tenant A's row while the permissive tenant-isolation policy still hides tenant B's and refuses every move into B."
principal_kind = "system"

[tables.stored_files]
reason = "UPLOADS-02 puts a released file behind the ACCESS-03 project-scope policy, so a principal is needed to see any row. A system principal is tenant-wide, so the own-row probe sees tenant A's row while the permissive tenant-isolation policy still hides tenant B's and refuses every move into B. UPLOADS-08: an uploaded file also needs a project and an uploader (ck_stored_files_upload_owner); only a generated file may leave them NULL."
principal_kind = "system"
values = { project_id = "'00000000-0000-4000-8000-0000000000f{tag}'::uuid", uploaded_by = "'00000000-0000-4000-8000-0000000000e{tag}'::uuid" }

[tables.form_templates]
reason = "code is a lowercase slug of letters, digits and hyphens (ck_form_templates_code); the generic 'iso_code_{tag}' has an underscore. Unique per row."
values = { code = "'iso-code-{tag}'" }

[tables.report_templates]
reason = "content_sha256 must be 64 lowercase hex digits (ck_report_templates_content_sha256); the generic text seed is not."
values = { content_sha256 = "repeat('{tag}', 64)" }

[tables.report_data_snapshots]
reason = "REPORTS-02: data_hash must be 64 lowercase hex digits and size_bytes at most 5 MB (check constraints). The table carries the ACCESS-03 project-scope policy, so a principal is needed to see any row; a system principal is tenant-wide while tenant isolation still hides tenant B's row."
principal_kind = "system"
values = { data_hash = "repeat('{tag}', 64)", size_bytes = "1" }

[tables.report_render_jobs]
reason = "REPORTS-02: data_hash and the optional sha256 columns must be 64 lowercase hex digits, and a succeeded job needs a file (check constraints), so seed a queued job with a valid hash. The table carries the ACCESS-03 project-scope policy, so a principal is needed to see any row; a system principal is tenant-wide while tenant isolation still hides tenant B's row."
principal_kind = "system"
values = { data_hash = "repeat('{tag}', 64)", status = "'queued'", html_sha256 = "NULL", pdf_sha256 = "NULL", idempotency_key = "NULL" }

[tables.role_assignment]
reason = "ACCESS-04 made user_id nullable for team assignments; ck_role_assignment_scope needs a user_id on every non-team scope, so seed one (FKs are not checked by the generator's superuser seed)."
values = { user_id = "gen_random_uuid()" }
