# Alembic configuration (DATABASE-08, ADR 0002). Run it through `aip-db migrate`, never directly.
# Forward-only raw-SQL revisions; autogenerate is not used, so env.py sets no target_metadata.
# The database URL comes from DATABASE_MIGRATOR_URL (a direct connection as aip_owner, never
# through PgBouncer), not from this file.

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60
version_path_separator = os
timezone = UTC
version_table_schema = aip_meta
transaction_per_migration = true

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
