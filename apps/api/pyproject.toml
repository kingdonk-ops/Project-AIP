[project]
name = "aip"
version = "0.1.0"
description = "AIP API: FastAPI app, platform services and business modules (ADR 0001, 0004)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
aip-db = "aip.platform.db.migrator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aip"]
