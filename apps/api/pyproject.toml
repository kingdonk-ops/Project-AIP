[project]
name = "aip"
version = "0.1.0"
description = "AIP API: FastAPI app, platform services and business modules (ADR 0001, 0004)"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=13.2",
    "alembic>=1.14,<2",
    "asyncpg>=0.30",
    "authlib>=1.9.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "joserfc>=1.3",
    "limits>=5.0",
    "jsonschema>=4.23",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-redis>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "procrastinate>=3.10.0,<3.11",
    "pydantic-settings>=2.6",
    "pydantic>=2.9",
    "redis>=8.1.0",
    "rfc8785>=0.1.2",
    "sqlalchemy[asyncio]>=2.1.6,<2.2",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.32",
    "pyicumessageformat>=1.0",
    "babel>=2.16",
    "jinja2>=3.1",
]

[project.scripts]
aip-db = "aip.platform.db.migrator.cli:main"
aip-access = "aip.modules.access.roles.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.4.1",
    "httpx>=0.27",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pypdf>=6.21.2",
    "pyyaml>=6",
    "testcontainers[keycloak,postgres,redis]>=4.15.0",
    "types-aioboto3[s3]>=15.5.0",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aip"]
# Git-ignored, so listed explicitly: the image build writes it (TERMS-07).
artifacts = ["aip/modules/terms/data/lint_findings.json"]
