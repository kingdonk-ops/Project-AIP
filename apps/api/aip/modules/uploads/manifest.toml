# Module manifest, validated by aip.platform.modules.manifest.ModuleManifest.
id = "uploads"
context = "uploads"
depends_on = ["tenancy", "projects"]
permission_namespaces = ["uploads"]
settings = []
term_keys = []

[[permissions]]
code = "uploads.create"
description = "Start an upload session and presign into quarantine"

[[permissions]]
code = "uploads.view"
description = "View upload sessions and their scan status"

[[permissions]]
code = "uploads.admin"
description = "Administer uploads: view any session's status and the quarantine review list"

# ``upload.completed`` / ``upload.rejected`` are emitted on release in UPLOADS-02. They are declared
# there, together with their registered payload models and frozen schemas: ARCH-06's
# verify_manifest_events (ADR 0029) fails boot if a manifest declares an event with no registered
# model, and UPLOADS-01 emits nothing, so declaring them here would require speculative payloads.
