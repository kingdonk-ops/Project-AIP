# Module manifest, validated by aip.platform.modules.manifest.ModuleManifest.
id = "uploads"
context = "uploads"
depends_on = ["tenancy", "projects"]
permission_namespaces = ["uploads"]
settings = []
term_keys = []

[[permissions]]
code = "uploads.create"
description = "Start an upload session and presign into quarantine"

[[permissions]]
code = "uploads.view"
description = "View upload sessions and their scan status"

[[permissions]]
code = "uploads.admin"
description = "Administer uploads: view any session's status and the quarantine review list"

# ``upload.completed`` / ``upload.rejected`` are emitted on release in UPLOADS-02 (see events.py).
# ARCH-06's verify_manifest_events (ADR 0029) fails boot unless each declared event has a registered
# payload model, and the registered set matches this list exactly.
[[events]]
name = "upload.completed"
version = 1

[[events]]
name = "upload.rejected"
version = 1

# OPS-17 Part B (UPLOADS-01 step 7): expire stale upload sessions, fanned out per active tenant by
# the OPS-13 trigger. Hourly, because the presign TTL is short.
[[schedules]]
job = "uploads.expire_sessions"
cron = "7 * * * *"
period = "hour"
