# Module manifest, validated by aip.platform.modules.manifest.ModuleManifest.
# TENANCY-01: tenants, deployment regions, fixture tenants and tenant resolution.
#   Route: GET /api/v1/me/tenant (guarded by require_active_tenant).
#   Region labels are the terminology keys in deployment_regions.label_key.
# ENT-01: entitlements (plans in code, subscription, overrides, monthly usage) and
#   GET /api/v1/settings/plan-and-usage. The operator routes live in the ops module (ADR 0029).
# ARCH-08: tenancy also owns the `tenant` permission namespace for tenant-wide settings whose
#   pages live under aip.platform.* (permissions come only from manifests, ACCESS-01):
#   tenant.flags.manage gates PUT /api/v1/settings/flags/{flag} (aip.platform.flags).
# TENANCY-03: organisations (owner, client, subcontractor) under /api/v1/settings/organisations;
#   the default roles get read at the access matrix's tenancy `view` level, manage at `admin`.
id = "tenancy"
context = "tenancy"
depends_on = []
permission_namespaces = ["tenancy", "tenant"]
subscribes = []
settings = ["ENTITLEMENTS_DB_ESTIMATE_METHOD", "ENTITLEMENTS_DB_ESTIMATE_URL"]
term_keys = [
  "tenancy.region.ap_southeast_2",
  "tenancy.region.eu_west_2",
  "tenancy.region.ap_southeast_1",
]

[[permissions]]
code = "tenancy.plan.read"
description = "Read the tenant plan, features, limits and usage (read-only)"

[[permissions]]
code = "tenant.flags.manage"
description = "Switch the tenant's release flags for deferred modules (BIM, AI)"

[[permissions]]
code = "tenancy.organisation.read"
description = "List and view the tenant's owner, client and subcontractor organisations"

[[permissions]]
code = "tenancy.organisation.manage"
description = "Create, edit and deactivate organisations"

[[events]]
name = "tenant.entitlements_changed"
version = 1

[[events]]
name = "tenancy.organisation_created"
version = 1

[[events]]
name = "tenancy.organisation_updated"
version = 1
