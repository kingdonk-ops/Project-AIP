# Module manifest, validated by aip.platform.modules.manifest.ModuleManifest.
id = "portal"
context = "portal"
depends_on = ["tenancy", "identity", "access", "projects", "assets", "audit"]
permission_namespaces = ["portal"]
subscribes = [{ name = "project.archived", version = 1 }]
# PORTAL-02: the client routes' rate limits (rate_limit.py; 120 and 300 per minute by default).
settings = ["PORTAL_RATE_LIMIT_SESSION_PER_MIN", "PORTAL_RATE_LIMIT_IP_PER_MIN"]
term_keys = [
  "portal.signin.title",
  "portal.signin.email",
  "portal.signin.continue",
  "portal.signin.second_factor",
  "portal.signin.signed_out",
  "portal.signin.session_ended",
  "portal.status.expired",
  "portal.error.rate_limited",
  "portal.error.not_found",
]

# PORTAL-02 session policy: a portal session is identity's `portal` audience with its own cookies
# (__Host-aip_portal_sid / __Host-aip_portal_csrf) and the tenant's `portal` session policy,
# tenant_auth_policy.session_policy.portal = {"idleMin": 15, "absoluteH": 8} by default (staff: 30
# min / 12 h). The portal idle timeout is capped at the staff one. Nothing of it is stored here.

# Internal permissions: assignable through roles (ACCESS-02); ACCESS-07 maps invite to project admins.

[[permissions]]
code = "portal.user.view"
description = "View external portal users and their grants"

[[permissions]]
code = "portal.user.invite"
description = "Invite external portal users to a project"

[[permissions]]
code = "portal.user.suspend"
description = "Suspend and reinstate external portal users"

[[permissions]]
code = "portal.grant.manage"
description = "Add, renew and revoke external portal users' project grants"

# External permissions: given only by portal grants (PortalGrantProvider), never by a role.

[[permissions]]
code = "portal.record.view"
description = "Portal users: view the records shared with them"

[[permissions]]
code = "portal.record.sign_off"
description = "Portal users: sign off the records shared with them"

[[permissions]]
code = "portal.record.witness"
description = "Portal users: witness hold points on the records shared with them"

[[permissions]]
code = "portal.report.download"
description = "Portal users: download the reports shared with them"

[[events]]
name = "portal_user.invited"
version = 1

[[events]]
name = "portal_user.status_changed"
version = 1

[[events]]
name = "portal_grant.created"
version = 1

[[events]]
name = "portal_grant.renewed"
version = 1

[[events]]
name = "portal_grant.revoked"
version = 1
