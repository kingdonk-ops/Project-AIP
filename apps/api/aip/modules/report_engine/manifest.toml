# ADR 0027 verbs: `view` reaches every role with a `view` level (or higher) on "Report engine &
# published records"; `manage` is an `admin` verb, so only admin roles get it. Uploading,
# publishing and retiring templates are tenant-admin actions in R1 (no designer, ADR 0007).
[[permissions]]
code = "report.template.view"
description = "View report templates"

[[permissions]]
code = "report.template.manage"
description = "Upload, publish and retire report templates"

# REPORTS-02: `view` and `create` follow the same row, so every role with `create` or higher on it
# may request a render, and every role with `view` may read render jobs. Both are checked against
# the record's project, together with the record's own view permission.
[[permissions]]
code = "report.view"
description = "View rendered reports"

[[permissions]]
code = "report.create"
description = "Request a report render"

[[events]]
name = "report.template_published"
version = 1

[[events]]
name = "report.render_succeeded"
version = 1

[[events]]
name = "report.render_failed"
version = 1

# REPORTS-04: every PDF download through the API, for the audit trail.
[[events]]
name = "report.downloaded"
version = 1

# REPORTS-03: an inspection reaching an auto-render state (its approval) queues its reports.
[[subscribes]]
name = "inspection.state_changed"
version = 1
