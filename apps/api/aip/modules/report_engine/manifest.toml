# Module manifest, validated by aip.platform.modules.manifest.ModuleManifest.
id = "report_engine"
context = "report_engine"
# REPORTS-02: the render job reads a project (projects), pins and stores files (uploads) and
# queues itself through the job registry (ops). REPORTS-03: the inspection report reads the
# inspection, its asset, its form revision and the responders' display names.
depends_on = [
  "tenancy",
  "terms",
  "projects",
  "uploads",
  "ops",
  "inspections",
  "assets",
  "forms",
  "identity",
]
