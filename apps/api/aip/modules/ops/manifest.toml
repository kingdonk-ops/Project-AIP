# Module manifest, validated by aip.platform.modules.manifest.ModuleManifest.
# OPS-04: the health probes live in health.py and are mounted by aip.main outside the registry,
# so AIP_DISABLED_MODULES can never remove them; routes.router is intentionally empty.
id = "ops"
context = "platform"
depends_on = []
# ops is the platform-context module, so it owns the `platform` permission namespace: the codes
# that gate the operator/platform-admin surfaces (ARCH-06's event catalogue, later dead-letter and
# replay). The pages live under aip.platform.*, but permissions come only from manifests (ACCESS-01),
# so they are declared here.
permission_namespaces = ["ops", "platform"]
events = []
subscribes = []
settings = []
term_keys = []

[[permissions]]
code = "platform.events.manage"
description = "Manage the domain-event catalogue (deprecate event versions)."
privileged = true
