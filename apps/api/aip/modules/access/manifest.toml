# Module manifest, validated by aip.platform.modules.manifest.ModuleManifest.
# ACCESS-01: the permission catalogue table and its startup sync, the per-tenant access version,
#   and GET /api/v1/access/me/abilities (authenticated). The runtime pieces every module uses
#   (PolicyService, public/authenticated/requires) live in aip.platform.access.
# Role and assignment permissions are declared here for ACCESS-02 and ACCESS-05.
# ACCESS-02: role, role_permission, role_assignment; the roles and role-assignments API; the
#   RoleGrantProvider behind PolicyService; outbox events below.
# depends_on tenancy: access_settings and role reference tenants. identity: assignments reference
#   app_user. projects: project-scope assignments reference projects.
id = "access"
context = "identity"
depends_on = ["tenancy", "identity", "projects"]
subscribes = []
settings = []
term_keys = [
  "access.role.tenant_admin.name",
  "access.role.project_manager.name",
  "access.role.qaqc_manager.name",
  "access.role.hse_officer.name",
  "access.role.supervisor.name",
  "access.role.inspector.name",
  "access.role.field_worker.name",
  "access.role.document_controller.name",
  "access.role.client_reviewer.name",
  "access.role.subcontractor.name",
  "access.role.auditor.name",
]

[[permissions]]
code = "access.role.read"
description = "View roles and their permissions"

[[permissions]]
code = "access.role.manage"
description = "Create, edit, reset and delete roles"
privileged = true

[[permissions]]
code = "access.role_assignment.read"
description = "View who holds which role"

[[permissions]]
code = "access.role_assignment.manage"
description = "Assign and remove roles"
privileged = true

[[permissions]]
code = "access.team.manage"
description = "Create teams and manage their members"

[[permissions]]
code = "access.matrix.export"
description = "Export the permission matrix"

[[events]]
name = "access.role.changed"
version = 1

[[events]]
name = "access.role_assignment.created"
version = 1

[[events]]
name = "access.role_assignment.removed"
version = 1
