  "item_types.field_type.text",
  "item_types.field_type.number",
  "item_types.field_type.decimal",
  "item_types.field_type.date",
  "item_types.field_type.dropdown",
  "item_types.field_type.multi_select",
  "item_types.field_type.measurement",
  "item_types.field_type.boolean",
  "item_types.field_type.photo",
  "item_types.field_type.signature",
  "item_types.field_type.asset_ref",
  "item_types.field_type.user_ref",
  "item_types.version.status.draft",
  "item_types.version.status.published",
  "item_types.issue.attribute_key_invalid",
  "item_types.issue.attribute_key_duplicate",
  "item_types.issue.attribute_label_missing",
  "item_types.issue.attribute_field_type_unknown",
  "item_types.issue.attribute_field_type_not_allowed",
  "item_types.issue.attribute_config_invalid",
  "item_types.issue.attribute_range_invalid",
  "item_types.issue.attribute_option_duplicate",
  "item_types.issue.attributes_too_many",
  "validation.attribute.required",
  "validation.attribute.type",
  "validation.attribute.enum",
  "validation.attribute.const",
