# ADR 0027 verbs: view -> view level, edit -> edit level, manage -> admin level, so the default
# roles pick these up at the right access-matrix levels on the next `aip-access seed-roles` run.
[[permissions]]
code = "item_type.view"
description = "Read content types, categories, item types and the field-type registry"

[[permissions]]
code = "item_type.edit"
description = "Create, edit and delete item categories, item types and draft versions"

[[permissions]]
code = "item_type.manage"
description = "Create, edit, reorder and delete content types"

# `publish` is named by no ADR 0027 level, so only `admin` roles get it by default (fail closed):
# publishing freezes a version that assets then pin (ITEMTYPES-02).
[[permissions]]
code = "item_type.publish"
description = "Publish an item-type attribute-schema version, freezing it"

[[events]]
name = "item_type.version_published"
version = 1
