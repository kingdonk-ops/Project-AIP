# Module manifest, validated by aip.platform.modules.manifest.ModuleManifest.
id = "approvals"
context = "approvals"
depends_on = ["access", "identity", "tenancy"]
permission_namespaces = ["approvals"]
subscribes = []
settings = []
term_keys = []

[[permissions]]
code = "approvals.view"
description = "View workflow definitions and record workflows"

[[permissions]]
code = "approvals.design"
description = "Create, edit and publish workflow definitions"

[[permissions]]
code = "approvals.start"
description = "Start the workflow of a record, or an approval route on it"

# APPROVALS-04: decide an approval route step you are an approver of (ADR 0040: the verb `approve`
# reaches the approve level, Client Reviewer included).
[[permissions]]
code = "approvals.approve"
description = "Approve or reject approval route steps you are an approver of"

# APPROVALS-05/09: the inspection lifecycle presets (config/workflows/inspection_*.json). The R1
# inspections tasks may move these to the inspections manifest.
[[permissions]]
code = "approvals.inspection.assign"
description = "Ready, schedule, assign and hand over inspections, assign with comment and return to draft"

[[permissions]]
code = "approvals.inspection.execute"
description = "Assign to me, inspect, check out to and in from Go, request supervisor review or clarification, and abort inspections"

[[permissions]]
code = "approvals.inspection.review"
description = "Edit an inspection's answers during supervisor review"

[[permissions]]
code = "approvals.inspection.approve"
description = "Mark an inspection as performed or request rework at supervisor review"

[[permissions]]
code = "approvals.inspection.client_approve"
description = "Approve an inspection or request rework at client review"

[[permissions]]
code = "approvals.inspection.retire"
description = "Retire inspections"

[[events]]
name = "workflow.transitioned"
version = 1

[[events]]
name = "workflow.definition_published"
version = 1

[[events]]
name = "approval.requested"
version = 1

[[events]]
name = "approval.approved"
version = 1

[[events]]
name = "approval.rejected"
version = 1

[[events]]
name = "approval.completed"
version = 1
