# Module manifest, validated by aip.platform.modules.manifest.ModuleManifest.
id = "approvals"
context = "approvals"
depends_on = ["access", "identity", "tenancy"]
permission_namespaces = ["approvals"]
subscribes = []
settings = []
term_keys = []

[[permissions]]
code = "approvals.view"
description = "View workflow definitions and record workflows"

[[permissions]]
code = "approvals.design"
description = "Create, edit and publish workflow definitions"

[[permissions]]
code = "approvals.start"
description = "Start the workflow of a record"

# APPROVALS-05: the inspection lifecycle presets (config/workflows/inspection_*.json). The R1
# inspections tasks may move these to the inspections manifest.
[[permissions]]
code = "approvals.inspection.assign"
description = "Ready, assign, unassign and resend inspections"

[[permissions]]
code = "approvals.inspection.execute"
description = "Start an assigned inspection and submit it for review"

[[permissions]]
code = "approvals.inspection.review"
description = "Pass or reject an inspection at inspector review"

[[permissions]]
code = "approvals.inspection.approve"
description = "Approve or reject an inspection at supervisor review"

[[permissions]]
code = "approvals.inspection.client_approve"
description = "Approve or reject an inspection at client review"

[[events]]
name = "workflow.transitioned"
version = 1

[[events]]
name = "workflow.definition_published"
version = 1
