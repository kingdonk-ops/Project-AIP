# Module manifest, validated by aip.platform.modules.manifest.ModuleManifest.
# IDENTITY-01: staff sign-in through Keycloak (ADR 0005). Routes (both public, x-aip-access):
#   POST /api/v1/auth/login/start, GET /api/v1/auth/oidc/callback.
# IDENTITY-02: app_user, tenant_membership, auth_event; JIT provisioning in the callback;
#   GET /api/v1/me (authenticated). identity.user.manage is privileged (status changes,
#   ACCESS-01 should require step-up for it).
# IDENTITY-03: user_session, tenant_auth_policy; the __Host- session and CSRF cookies; logout,
#   back-channel logout, GET/DELETE /api/v1/me/sessions; the identity.revoke_keycloak_sessions job.
# IDENTITY-04: user_invite, signoff_policy, app_user.mfa_enrolled_at; invites (Keycloak sends the
#   email), MFA reset, step-up (GET /api/v1/auth/step-up/start) and sign-off assurance (ADR 0010);
#   jobs identity.send_invite, identity.disable_keycloak_user, identity.reset_keycloak_mfa.
# depends_on tenancy: login_directory and the user tables reference tenants (TENANCY-01).
#   ops: revocation enqueues its Keycloak job through the ops job registry (ADR 0003).
id = "identity"
context = "identity"
depends_on = ["tenancy", "ops"]
subscribes = []
settings = [
  "KEYCLOAK_URL",
  "KEYCLOAK_PUBLIC_URL",
  "KEYCLOAK_REALM",
  "OIDC_CLIENT_ID",
  "OIDC_CLIENT_SECRET",
  "APP_ORIGIN",
  "PREAUTH_COOKIE_KEY",
  "AUTH_TEST_STUB",
  "KEYCLOAK_ADMIN_CLIENT_ID",
  "KEYCLOAK_ADMIN_CLIENT_SECRET",
  "REDIS_URL",
  "AIP_TEST_CLOCK_OFFSET",
]
term_keys = []

# ACCESS-01: [[permissions]] tables come after every top-level key (TOML).
[[permissions]]
code = "identity.user.read"
description = "View users of the tenant"

[[permissions]]
code = "identity.user.manage"
description = "Invite, activate and deactivate users"
privileged = true

[[permissions]]
code = "identity.signoff_policy.read"
description = "View the minimum sign-in assurance for critical actions"

[[permissions]]
code = "identity.signoff_policy.manage"
description = "Change the minimum sign-in assurance for critical actions"
privileged = true

[[events]]
name = "identity.signoff_policy.changed"
version = 1
