# Module manifest, validated by aip.platform.modules.manifest.ModuleManifest.
id = "audit"
context = "audit"
depends_on = []
settings = []
term_keys = []

# AUDIT-02: the catch-all outbox subscriber that writes every event into the audit chains, and
# the event AuditApi.record_security_event publishes.
[[subscribes]]
name = "*"
version = 1

[[events]]
name = "audit.security_event"
version = 1

# Audit read permissions are separate from tenant admin (AUDIT-01); they are enforced in AUDIT-04.
[[permissions]]
code = "audit.log.read"
description = "Read raw audit log entries and verify the hash chain"

[[permissions]]
code = "audit.activity.view"
description = "View the activity feed and project timeline built over the audit log"
