# Web app server (STACK-05). nginx-unprivileged keeps its pid and temp files in /tmp, so the
# container runs as UID 10001 with a read-only root and a tmpfs /tmp.
#
# Security headers (DESIGN-02, OPS-11) mirror apps/web/security-headers.json. nginx drops inherited
# add_header lines in any block that sets its own, so every location repeats the full set
# (tools/tests/test_coolify.py checks both nginx configs against the JSON). HSTS (SECURITY-11)
# is nginx-only, not in the JSON: TLS always ends in front of this server, never at vite.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    # The client address (review 11 M1): the ALB (ADR 0026) or Coolify's proxy reaches this
    # container from a private network and appends the real peer to X-Forwarded-For. Trusting only
    # private hops and taking the rightmost untrusted address means a client-supplied
    # X-Forwarded-For cannot pick its own IP (the API's login rate limit keys on it). The API gets
    # this one address, never the client's list.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # The API, same origin (as `vite preview` does in the e2e run).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (OPS/notifications) must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Hashed build files (vite build.assetsDir). Not /assets/: that is the asset register route.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files $uri =404;
    }

    # Client-side routes fall back to the SPA shell.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }
}
